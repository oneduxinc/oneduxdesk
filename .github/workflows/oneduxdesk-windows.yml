# OneDux Desk: Windows x64 build (MSI + unpacked folder as workflow artifacts).
#
# The build steps are copied from flutter-build.yml `build-for-windows-flutter` (x64 row), with the same
# pinned versions and action SHAs; ARM64, the RustDesk signing service and release publishing are dropped.
# Packaging follows upstream's custom-client MSI template step: the exe is renamed to <app-name>.exe and
# res/oneduxdesk/custom.txt is placed next to it, then preprocess.py builds the MSI with --app-name, which
# also gives it an UpgradeCode distinct from RustDesk's.
#
# Upstream workflows (ci, flutter-ci, flutter-nightly, flutter-tag, fdroid, update-webpki-roots, ...) are
# disabled in the repository settings, not deleted, so rebasing onto upstream stays conflict-free.
name: OneDux Desk Windows

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release number N for version <upstream>-oneduxdesk.N; leave empty for a dev build"
        required: false
        default: ""
  push:
    branches:
      - oneduxdesk
    paths-ignore:
      - "docs/**"
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.75"
  SCITER_RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  # vcpkg removed its 'x-gha' binary cache backend (the build log says so and ignores it), so every
  # run rebuilt ffmpeg / libvpx / aom from source. Built packages now go to a plain directory that
  # actions/cache keeps; it is saved right after `vcpkg install`, so a run that later fails in the
  # Rust / Flutter build still leaves the next run a warm cache.
  VCPKG_BINARY_SOURCES: "clear;files,C:/vcpkg-bincache,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.0"
  APP_NAME: "OneDuxDesk"
  # What Windows shows in Settings > Apps and in the installer dialogs (the MSI ProductName). APP_NAME
  # cannot carry the space: install folder, exe, service, registry keys and the deep-link scheme all
  # derive from it.
  DISPLAY_NAME: "OneDux Desk"
  MANUFACTURER: "OneDux"
  # Compiled into telemetry batches as client.build (src/oneduxdesk_telemetry.rs, option_env!).
  ONEDUXDESK_BUILD: ${{ github.sha }}
  # Release number N (manual runs only); empty = dev build. Compiled into the telemetry version
  # (<upstream>-oneduxdesk.N / .dev) and used in the MSI file name.
  ONEDUXDESK_RELEASE: ${{ github.event.inputs.release }}

jobs:
  # Inlined from bridge.yml, keeping only the Flutter 3.22.3 row that the x64 build uses (bridge.yml
  # also generates a Flutter 3.44 bridge for the Windows ARM64 build, which we do not make; its
  # caches took ~1.8 GB of the repository's 10 GB). The "Cache Bridge" step is dropped: it cached
  # /tmp/flutter_rust_bridge, which nothing writes, through the retired actions/cache v3 service.
  # bridge.yml itself stays untouched so rebasing onto upstream does not conflict.
  generate-bridge:
    runs-on: ubuntu-22.04
    env:
      CARGO_EXPAND_VERSION: "1.0.95"
      FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
      BRIDGE_FLUTTER_VERSION: "3.22.3"
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get install ca-certificates -y
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc \
            git \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: bridge-ubuntu-22.04

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          # Flutter 3.22.3: extended_text 14 needs a newer Dart, so downgrade for resolution (as upstream).
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  build-windows-x64:
    name: x86_64-pc-windows-msvc
    needs: [generate-bridge]
    runs-on: windows-2022
    # contents: write only for tagging a release (the last step); the repository default is read.
    permissions:
      contents: write
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      # Release runs only: fail in the first minute, not after the hour-long build, if the number
      # is malformed, the branch is wrong or the tag already exists.
      - name: Check release number
        if: env.ONEDUXDESK_RELEASE != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$ONEDUXDESK_RELEASE" =~ ^[1-9][0-9]*$ ]] || { echo "::error::release must be a positive integer, got '$ONEDUXDESK_RELEASE'"; exit 1; }
          [[ "$GITHUB_REF" == "refs/heads/oneduxdesk" ]] || { echo "::error::releases are made from the oneduxdesk branch, not $GITHUB_REF"; exit 1; }
          tag="${VERSION}-oneduxdesk.${ONEDUXDESK_RELEASE}"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::tag $tag already exists; use the next release number"; exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "Release $tag from $GITHUB_SHA"

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          # Its own cache of the vcpkg tool uses the retired cache service (400 on restore, 503 on
          # save); bootstrapping the tool takes about a minute anyway.
          doNotCache: true

      - name: Restore vcpkg binary cache
        id: vcpkg-bincache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:/vcpkg-bincache
          key: vcpkg-bin-x64-windows-static-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('vcpkg.json', 'res/vcpkg/**') }}
          restore-keys: |
            vcpkg-bin-x64-windows-static-${{ env.VCPKG_COMMIT_ID }}-

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          mkdir -p /c/vcpkg-bincache
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
        shell: bash

      - name: Save vcpkg binary cache
        if: steps.vcpkg-bincache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:/vcpkg-bincache
          key: ${{ steps.vcpkg-bincache.outputs.cache-primary-key }}

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          # Virtual display driver, same source as upstream
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

      # Our unit tests (telemetry, IPv6 without STUN). Same profile, features and --lib as build.py's
      # `cargo build`, so only this crate's test harness is compiled; upstream's own tests are not run
      # here (some need the network).
      - name: OneDux Desk unit tests
        shell: bash
        run: |
          set -o pipefail
          # A filter that matches nothing still "passes" (0 tests); fail instead, so a rename after
          # a rebase cannot silently switch these tests off.
          for f in oneduxdesk test_ipv6; do
            cargo test --locked --features hwcodec,vram,flutter --lib --release -- "$f" 2>&1 | tee "test-$f.log"
            grep -Eq "test result: ok\. [1-9][0-9]* passed" "test-$f.log" || { echo "::error::no test matched '$f'"; exit 1; }
          done

      - name: OneDux Desk packaging (rename exe, add signed custom.txt)
        shell: bash
        run: |
          mv ./rustdesk/rustdesk.exe "./rustdesk/${APP_NAME}.exe"
          cp ./res/oneduxdesk/custom.txt ./rustdesk/custom.txt
          ls -l ./rustdesk | head -40

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Build msi
        run: |
          pushd ./res/msi
          python preprocess.py --arp -d ../../rustdesk --app-name $env:APP_NAME --manufacturer $env:MANUFACTURER
          # Only the package's display name (MSI ProductName) gets the space; $(var.Product) keeps feeding
          # every path, service and registry key. Fail rather than ship the old name if upstream moves it.
          $pkg = 'Package/Package.wxs'
          $wxs = Get-Content $pkg -Raw
          if ($wxs -notmatch 'Package Name="\$\(var\.Product\)"') { throw "Package.wxs changed upstream: cannot set the display name" }
          $wxs = $wxs -replace 'Package Name="\$\(var\.Product\)"', "Package Name=`"$env:DISPLAY_NAME`""
          Set-Content -Path $pkg -Value $wxs -NoNewline -Encoding utf8BOM
          Select-String -Path $pkg -Pattern '<Package Name=' | ForEach-Object { $_.Line.Trim() }
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          popd
          mkdir ./out
          $n = if ($env:ONEDUXDESK_RELEASE) { $env:ONEDUXDESK_RELEASE } else { "dev.${{ github.run_number }}" }
          $name = "$env:APP_NAME-$env:VERSION-oneduxdesk.$n-x86_64.msi"
          mv $msi.FullName "./out/$name"
          # <name>.sha256 travels with the MSI: the console release step re-hashes the file it
          # downloaded and compares (make release-rdh-client in console/ansible).
          $hash = (Get-FileHash "./out/$name" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "./out/$name.sha256" -Value "$hash  $name" -NoNewline -Encoding ascii
          Get-Content "./out/$name.sha256"

      # Release runs: the artifact is named after the release tag and kept 90 days, so the console
      # release step can find it by name (`make release-rdh-client n=N`). Dev runs: as before.
      # (`env.RELEASE_TAG && …`, not `!= ''`: unset is null, and null != '' is true.)
      - name: Upload msi
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.RELEASE_TAG && format('oneduxdesk-msi-{0}', env.RELEASE_TAG) || 'oneduxdesk-windows-x86_64-msi' }}
          path: |
            ./out/*.msi
            ./out/*.msi.sha256
          retention-days: ${{ env.RELEASE_TAG && 90 || 14 }}

      - name: Upload unpacked folder
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oneduxdesk-windows-x86_64
          path: ./rustdesk
          retention-days: 14

      # AGPL: every released build must map to its source. Only after everything above succeeded;
      # a tag, no GitHub release - installers are distributed through the OneDux console only.
      - name: Tag the release commit
        if: env.ONEDUXDESK_RELEASE != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA" --jq '.ref + " -> " + .object.sha'
